<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications - Worker</title>
  <meta name="description" content="View the progress and status of your submitted work applications." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="app-header-container"></div>

  <main class="main-content">
    <div class="container">
      <div class="page-title-section">
        <h1 class="page-title" data-i18n="my_apps_title">My Applications</h1>
        <p class="page-subtitle" data-i18n="my_apps_sub">Track the status of the works and jobs you have applied for.</p>
      </div>

      <!-- Applications List Container -->
      <div id="my-applications-container" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="loading-container">
          <span class="spinner"></span>
          <p>Loading your applications...</p>
        </div>
      </div>
    </div>
  </main>

  <div id="mobile-bottom-nav"></div>

  <script type="module">
    import { protectPage, renderHeader, renderMobileBottomBar } from "./js/common.js";
    import { initMyApplicationsPage } from "./js/applications.js";

    protectPage({ requireAuth: true });
    renderHeader("my-applications");
    renderMobileBottomBar("my-applications");
    initMyApplicationsPage();
  </script>
</body>
</html>
