<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Available Work - Worker</title>
  <meta name="description" content="Explore active 24-hour work posts, jobs, and skilled worker opportunities near you." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Dynamic Header Navigation Container -->
  <div id="app-header-container"></div>

  <!-- Main Content Dashboard -->
  <main class="main-content">
    <div class="container">
      <!-- Title & Hero Heading -->
      <div class="page-title-section">
        <div class="page-title-row">
          <div>
            <h1 class="page-title">Available Work</h1>
            <p class="page-subtitle">Real-time work posts available for 24 hours. Connect directly with owners.</p>
          </div>
          <a href="add-work.html" class="btn btn-primary" id="btn-home-add-work">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Post New Work</span>
          </a>
        </div>
      </div>

      <!-- Search & Category Filters -->
      <div class="search-filter-card">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="search-works-input"
            class="search-input"
            placeholder="Search by owner, city, state, address, category, or details..."
          />
        </div>

        <!-- Category Horizontal Pills -->
        <div class="category-chips">
          <button class="chip-btn active" data-category="all">All Categories</button>
          <button class="chip-btn" data-category="Construction">Construction</button>
          <button class="chip-btn" data-category="Electrical">Electrical</button>
          <button class="chip-btn" data-category="Plumbing">Plumbing</button>
          <button class="chip-btn" data-category="Driving">Driving</button>
          <button class="chip-btn" data-category="Delivery">Delivery</button>
          <button class="chip-btn" data-category="Cleaning">Cleaning</button>
          <button class="chip-btn" data-category="Computer / IT">Computer / IT</button>
          <button class="chip-btn" data-category="Office Work">Office Work</button>
          <button class="chip-btn" data-category="Factory Work">Factory Work</button>
          <button class="chip-btn" data-category="Agriculture">Agriculture</button>
          <button class="chip-btn" data-category="Shop Work">Shop Work</button>
          <button class="chip-btn" data-category="Other">Other</button>
        </div>
      </div>

      <!-- Works Grid List Container -->
      <div id="works-grid-container" class="works-grid">
        <div class="loading-container" style="grid-column: 1 / -1;">
          <span class="spinner"></span>
          <p>Loading available works...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <div id="mobile-bottom-nav"></div>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="container footer-inner">
      <div>© 2026 Worker. 24-hour direct job discovery.</div>
      <div style="display: flex; gap: 1rem;">
        <a href="language.html" style="color: var(--text-muted);">Language / மொழி</a>
        <a href="profile.html" style="color: var(--text-muted);">My Account</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { protectPage, renderHeader, renderMobileBottomBar } from "./js/common.js";
    import { initHomeWorksFeed } from "./js/works.js";

    protectPage({ requireAuth: false });
    renderHeader("home");
    renderMobileBottomBar("home");
    initHomeWorksFeed();
  </script>
</body>
</html>
