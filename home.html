<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Available Works - Work Connect</title>
  <meta name="description" content="Explore available local jobs, labor works, carpentry, electrical, plumbing, and other skilled works." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Dynamic Header Navigation Container -->
  <div id="app-header-container"></div>

  <!-- Main Content Dashboard -->
  <main class="main-content">
    <div class="container">
      <!-- Title & Hero Heading -->
      <div class="page-title-section">
        <div class="page-title-row">
          <div>
            <h1 class="page-title" data-i18n="home_heading">Available Works</h1>
            <p class="page-subtitle" data-i18n="home_subheading">Explore local jobs and work opportunities near you.</p>
          </div>
          <a href="add-work.html" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span data-i18n="nav_add_work">Add Work</span>
          </a>
        </div>
      </div>

      <!-- Search & Category Filters -->
      <div class="search-filter-card">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="text"
            id="search-works-input"
            class="search-input"
            placeholder="Search work, workplace or location..."
            data-i18n-placeholder="search_placeholder"
          />
        </div>

        <!-- Category Horizontal Pills -->
        <div class="category-chips">
          <button class="chip-btn active" data-category="all" data-i18n="cat_all">All Categories</button>
          <button class="chip-btn" data-category="Electrical & Wiring" data-i18n="cat_electrician">Electrical & Wiring</button>
          <button class="chip-btn" data-category="Carpentry & Woodwork" data-i18n="cat_carpenter">Carpentry & Woodwork</button>
          <button class="chip-btn" data-category="Plumbing" data-i18n="cat_plumber">Plumbing</button>
          <button class="chip-btn" data-category="Painting" data-i18n="cat_painting">Painting</button>
          <button class="chip-btn" data-category="Construction & Labor" data-i18n="cat_construction">Construction & Labor</button>
          <button class="chip-btn" data-category="Driver & Delivery" data-i18n="cat_driving">Driver & Delivery</button>
          <button class="chip-btn" data-category="Housekeeping & Maid" data-i18n="cat_housekeeping">Housekeeping & Maid</button>
          <button class="chip-btn" data-category="Cooking & Catering" data-i18n="cat_cooking">Cooking & Catering</button>
          <button class="chip-btn" data-category="Shop & Retail" data-i18n="cat_retail">Shop & Retail</button>
          <button class="chip-btn" data-category="Other Work" data-i18n="cat_other">Other Work</button>
        </div>
      </div>

      <!-- Works Grid List Container -->
      <div id="works-grid-container" class="works-grid">
        <div class="loading-container" style="grid-column: 1 / -1;">
          <span class="spinner"></span>
          <p>Loading available works...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <div id="mobile-bottom-nav"></div>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="container footer-inner">
      <div>© 2026 Work Connect. Connecting workers & employers directly.</div>
      <div style="display: flex; gap: 1rem;">
        <a href="language.html" style="color: var(--text-muted);">Language / மொழி</a>
        <a href="profile.html" style="color: var(--text-muted);">My Account</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { protectPage, renderHeader, renderMobileBottomBar } from "./js/common.js";
    import { initHomeWorksFeed } from "./js/works.js";

    protectPage({ requireAuth: false });
    renderHeader("home");
    renderMobileBottomBar("home");
    initHomeWorksFeed();
  </script>
</body>
</html>
