<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Work Connect</title>
  <meta name="description" content="Sign in to Work Connect using Google to access local jobs, post works, and connect with workers." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card" id="login-card">
      <!-- App Brand Symbol -->
      <div class="auth-logo-badge">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
      </div>

      <h1 class="auth-title" data-i18n="auth_welcome_title">WORK CONNECT</h1>
      <p class="auth-tagline" data-i18n="auth_welcome_sub">Find Work • Share Work • Connect</p>

      <!-- Google Sign In Button -->
      <button type="button" class="btn-google" id="btn-google-login">
        <svg class="google-icon-svg" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
        </svg>
        <span id="google-btn-text" data-i18n="auth_google_btn">Continue with Google</span>
      </button>

      <!-- OR Divider -->
      <div class="auth-divider">
        <span data-i18n="auth_or_divider">OR</span>
      </div>

      <!-- Guest Sign In Button -->
      <button type="button" class="btn-guest" id="btn-guest-login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span id="guest-btn-text" data-i18n="auth_guest_btn">Continue as Guest</span>
      </button>

      <!-- Highlights -->
      <div class="auth-highlights">
        <div class="highlight-item">
          <div class="highlight-icon">⚡</div>
          <div class="highlight-text" data-i18n="auth_feature_1">Quick Work Matching</div>
        </div>
        <div class="highlight-item">
          <div class="highlight-icon">🛡️</div>
          <div class="highlight-text" data-i18n="auth_feature_2">Verified Contacts</div>
        </div>
        <div class="highlight-item">
          <div class="highlight-icon">📞</div>
          <div class="highlight-text" data-i18n="auth_feature_3">Direct Calling</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { protectPage } from "./js/common.js";
    import "./js/auth.js";

    // Protect login page: authenticated users are forwarded
    protectPage({ requireAuth: false });
  </script>
</body>
</html>
