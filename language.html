<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Language - Work Connect</title>
  <meta name="description" content="Select your preferred language: English, Tamil, or Hindi." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card" style="max-width: 500px;">
      <h1 class="auth-title" data-i18n="lang_select_title">SELECT LANGUAGE</h1>
      <p class="auth-tagline" data-i18n="lang_select_sub">Choose the language you are most comfortable with. You can change this anytime.</p>

      <!-- Language Selection Options -->
      <div class="lang-grid">
        <!-- Tamil -->
        <div class="lang-card-option" data-lang="ta" id="lang-opt-ta">
          <div>
            <span class="lang-title-native">தமிழ்</span>
            <span class="lang-title-en">Tamil</span>
          </div>
          <div class="lang-radio-check"></div>
        </div>

        <!-- English -->
        <div class="lang-card-option" data-lang="en" id="lang-opt-en">
          <div>
            <span class="lang-title-native">English</span>
            <span class="lang-title-en">International</span>
          </div>
          <div class="lang-radio-check"></div>
        </div>

        <!-- Hindi -->
        <div class="lang-card-option" data-lang="hi" id="lang-opt-hi">
          <div>
            <span class="lang-title-native">हिन्दी</span>
            <span class="lang-title-en">Hindi</span>
          </div>
          <div class="lang-radio-check"></div>
        </div>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="button" class="btn btn-primary btn-block btn-lg" id="btn-confirm-language">
          <span data-i18n="btn_lang_confirm">Confirm Language</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { protectPage } from "./js/common.js";
    import { initLanguagePage } from "./js/language.js";

    protectPage({ requireAuth: false });
    initLanguagePage();
  </script>
</body>
</html>
