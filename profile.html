<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - Work Connect</title>
  <meta name="description" content="View and manage your personal Work Connect profile, contact information, and language preferences." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="app-header-container"></div>

  <main class="main-content">
    <div class="container" style="max-width: 800px;">
      <div class="profile-card" id="profile-display-card">
        <!-- Profile Banner -->
        <div class="profile-hero"></div>

        <!-- Profile Info Header -->
        <div class="profile-info-header">
          <div style="display: flex; align-items: flex-end; gap: 1.25rem; flex-wrap: wrap;">
            <img id="display-profile-avatar" class="profile-avatar-large" src="" alt="Profile Avatar" />
            <div id="display-profile-initials" class="profile-avatar-large-initials" style="display: none;">U</div>
            <div>
              <h1 class="profile-name" id="display-profile-name">User</h1>
              <div class="profile-email" id="display-profile-email">user@example.com</div>
            </div>
          </div>

          <button id="btn-edit-profile-trigger" class="btn btn-primary btn-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            <span data-i18n="btn_edit_profile">Edit Profile</span>
          </button>
        </div>

        <!-- Profile Details Grid -->
        <div class="profile-content">
          <div class="profile-details-grid">
            <div>
              <div class="profile-item-label" data-i18n="lbl_location">City / District</div>
              <div class="profile-item-val" id="display-profile-location">Loading...</div>
            </div>

            <div>
              <div class="profile-item-label" data-i18n="lbl_mobile">Mobile Number</div>
              <div class="profile-item-val" id="display-profile-phone">Loading...</div>
            </div>

            <div style="grid-column: 1 / -1;">
              <div class="profile-item-label" data-i18n="lbl_address">Street Address / Landmark</div>
              <div class="profile-item-val" id="display-profile-address">Loading...</div>
            </div>
          </div>

          <!-- Language Settings Box -->
          <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
            <div>
              <div style="font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 0.5rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                Preferred Language
              </div>
              <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">
                Current: <strong id="display-profile-language">English</strong>
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <select id="profile-language-select" class="form-control" style="width: auto; padding: 0.45rem 1rem;">
                <option value="en">English</option>
                <option value="ta">தமிழ் (Tamil)</option>
                <option value="hi">हिन्दी (Hindi)</option>
              </select>
            </div>
          </div>

          <!-- Actions Bar -->
          <div class="profile-actions-bar">
            <a href="home.html" class="btn btn-secondary">
              ← <span data-i18n="nav_home">Home</span>
            </a>

            <button id="btn-profile-logout" class="btn btn-outline-danger">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              <span data-i18n="nav_logout">Logout</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Profile Modal -->
  <div class="modal-backdrop" id="edit-profile-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" data-i18n="btn_edit_profile">Edit Profile</h3>
        <button class="modal-close-btn" id="btn-close-edit-modal">&times;</button>
      </div>
      <form id="profile-edit-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="edit-input-name" data-i18n="lbl_name">Full Name</label>
            <input type="text" id="edit-input-name" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-input-location" data-i18n="lbl_location">City / District</label>
            <input type="text" id="edit-input-location" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-input-address" data-i18n="lbl_address">Street Address / Landmark</label>
            <input type="text" id="edit-input-address" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-input-mobile" data-i18n="lbl_mobile">Mobile Number</label>
            <input type="tel" id="edit-input-mobile" class="form-control" maxlength="10" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-edit-modal" data-i18n="btn_cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-edit-profile" data-i18n="btn_save_changes">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div id="mobile-bottom-nav"></div>

  <script type="module">
    import { protectPage, renderHeader, renderMobileBottomBar } from "./js/common.js";
    import { initProfileView } from "./js/profile.js";
    import { setupLanguageSwitcher } from "./js/language.js";

    protectPage({ requireAuth: true });
    renderHeader("profile");
    renderMobileBottomBar("profile");
    initProfileView();
    setupLanguageSwitcher("profile-language-select");
  </script>
</body>
</html>
