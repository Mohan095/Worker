<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Your Profile - Work Connect</title>
  <meta name="description" content="Set up your profile to connect with employers and apply for work." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card setup-card">
      <h1 class="auth-title" data-i18n="profile_setup_title">Complete Your Profile</h1>
      <p class="auth-tagline" data-i18n="profile_setup_sub">Set up your details to start applying and posting works.</p>

      <form id="profile-setup-form" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="input-name">
            <span data-i18n="lbl_name">Full Name</span> <span class="required">*</span>
          </label>
          <input type="text" id="input-name" class="form-control" placeholder="e.g. राजेश कुमार / Rajesh Kumar" required />
          <span class="form-error-msg" id="err-name">Please enter your full name.</span>
        </div>

        <!-- Location (City / District) -->
        <div class="form-group">
          <label class="form-label" for="input-location">
            <span data-i18n="lbl_location">City / District</span> <span class="required">*</span>
          </label>
          <input type="text" id="input-location" class="form-control" placeholder="e.g. Chennai, Madurai, Bengaluru" required />
          <span class="form-error-msg" id="err-location">Please enter your city or district.</span>
        </div>

        <!-- Street Address / Landmark -->
        <div class="form-group">
          <label class="form-label" for="input-address">
            <span data-i18n="lbl_address">Street Address / Landmark</span> <span class="required">*</span>
          </label>
          <input type="text" id="input-address" class="form-control" placeholder="e.g. No. 12, Gandhi Road, Near Bus Stand" required />
          <span class="form-error-msg" id="err-address">Please enter your street address or landmark.</span>
        </div>

        <!-- Mobile Number -->
        <div class="form-group">
          <label class="form-label" for="input-mobile">
            <span data-i18n="lbl_mobile">Mobile Number</span> <span class="required">*</span>
          </label>
          <input type="tel" id="input-mobile" class="form-control" placeholder="10-digit mobile number (e.g. 9876543210)" maxlength="10" required />
          <span class="form-error-msg" id="err-mobile">Please enter a valid 10-digit mobile number.</span>
        </div>

        <!-- Submit Button -->
        <div style="margin-top: 2rem;">
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-save-profile">
            <span data-i18n="btn_save_continue">SAVE & CONTINUE</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { protectPage } from "./js/common.js";
    import { initProfileSetup } from "./js/profile.js";

    // Requires authentication to set up profile
    protectPage({ requireAuth: true });
    initProfileSetup();
  </script>
</body>
</html>
