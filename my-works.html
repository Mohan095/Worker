<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Posted Works - Work Connect</title>
  <meta name="description" content="Manage your posted work requirements and review candidate applications." />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="app-header-container"></div>

  <main class="main-content">
    <div class="container">
      <div class="page-title-section">
        <div class="page-title-row">
          <div>
            <h1 class="page-title" data-i18n="my_works_title">My Posted Works</h1>
            <p class="page-subtitle" data-i18n="my_works_sub">Manage the work listings you have published and view candidate applications.</p>
          </div>
          <a href="add-work.html" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span data-i18n="nav_add_work">Add Work</span>
          </a>
        </div>
      </div>

      <!-- Works List Container -->
      <div id="my-works-container" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <div class="loading-container">
          <span class="spinner"></span>
          <p>Loading your work postings...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Work Modal -->
  <div class="modal-backdrop" id="edit-work-modal">
    <div class="modal-dialog" style="max-width: 620px;">
      <div class="modal-header">
        <h3 class="modal-title">Edit Work Listing</h3>
        <button class="modal-close-btn" id="btn-close-edit-work">&times;</button>
      </div>
      <form id="edit-work-form">
        <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
          <input type="hidden" id="edit-work-id" />
          
          <div class="form-group">
            <label class="form-label" for="edit-work-name">Work Title / Role <span class="required">*</span></label>
            <input type="text" id="edit-work-name" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-work-category">Category <span class="required">*</span></label>
            <select id="edit-work-category" class="form-control" required>
              <option value="Electrical & Wiring">Electrical & Wiring</option>
              <option value="Carpentry & Woodwork">Carpentry & Woodwork</option>
              <option value="Plumbing">Plumbing</option>
              <option value="Painting">Painting</option>
              <option value="Construction & Labor">Construction & Labor</option>
              <option value="Driver & Delivery">Driver & Delivery</option>
              <option value="Housekeeping & Maid">Housekeeping & Maid</option>
              <option value="Cooking & Catering">Cooking & Catering</option>
              <option value="Shop & Retail">Shop & Retail</option>
              <option value="Other Work">Other Work</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="edit-work-place">Workplace <span class="required">*</span></label>
              <input type="text" id="edit-work-place" class="form-control" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-work-address">Address <span class="required">*</span></label>
              <input type="text" id="edit-work-address" class="form-control" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="edit-work-mobile1">Primary Mobile <span class="required">*</span></label>
              <input type="tel" id="edit-work-mobile1" class="form-control" maxlength="10" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-work-mobile2">Alternative Mobile</label>
              <input type="tel" id="edit-work-mobile2" class="form-control" maxlength="10" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-work-desc">Work Description</label>
            <textarea id="edit-work-desc" class="form-control" rows="4"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-edit-work">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-edit-work">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Applicants Review Modal -->
  <div class="modal-backdrop" id="applicants-modal">
    <div class="modal-dialog" style="max-width: 680px;">
      <div class="modal-header">
        <h3 class="modal-title" id="applicants-modal-title">Review Applicants</h3>
        <button class="modal-close-btn" id="btn-close-applicants-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="applicants-list" id="applicants-modal-list"></div>
      </div>
    </div>
  </div>

  <div id="mobile-bottom-nav"></div>

  <script type="module">
    import { protectPage, renderHeader, renderMobileBottomBar } from "./js/common.js";
    import { initMyWorksPage } from "./js/works.js";

    protectPage({ requireAuth: true });
    renderHeader("my-works");
    renderMobileBottomBar("my-works");
    initMyWorksPage();
  </script>
</body>
</html>
